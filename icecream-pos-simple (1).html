<script type="text/babel" data-presets="react,stage-3">

const { useState, useEffect, useMemo } = React;
const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ---------------------------------------------------------------------
// Volume / formatting helpers
// ---------------------------------------------------------------------
function scoopsRemaining(remainingMl, scoopSizeMl = 30) {
  if (!scoopSizeMl) return 0;
  return Math.floor(remainingMl / scoopSizeMl);
}
function percentRemaining(remainingMl, tubSizeMl) {
  if (!tubSizeMl) return 0;
  return Math.max(0, Math.min(100, (remainingMl / tubSizeMl) * 100));
}
function stockLevel(remainingMl, tubSizeMl, lowThresholdMl) {
  if (remainingMl <= 0) return 'empty';
  if (remainingMl <= lowThresholdMl) return 'low';
  return 'ok';
}
function formatMl(ml) { return `${Math.round(ml).toLocaleString()} ml`; }
function formatCurrency(amount, symbol = '₹') {
  return `${symbol}${Number(amount).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
}

// ---------------------------------------------------------------------
// TubGauge — signature capsule-shaped fill indicator
// ---------------------------------------------------------------------
function TubGauge({ remainingMl, tubSizeMl, lowThresholdMl, size = 'md' }) {
  const pct = percentRemaining(remainingMl, tubSizeMl);
  const level = stockLevel(remainingMl, tubSizeMl, lowThresholdMl);
  const dims = size === 'sm' ? { w: 28, h: 40 } : { w: 40, h: 56 };
  const fillColor = level === 'empty' ? '#FF6F59' : level === 'low' ? '#FF9E7D' : '#0E7C7B';
  return (
    <div
      className="relative border-2 border-sageline bg-white overflow-hidden shrink-0"
      style={{ width: dims.w, height: dims.h, borderRadius: dims.w / 2 }}
      role="img"
      aria-label={`${Math.round(pct)}% remaining`}
    >
      <div
        className="absolute bottom-0 left-0 right-0 transition-all duration-500 ease-out"
        style={{ height: `${pct}%`, background: fillColor }}
      />
    </div>
  );
}

// ---------------------------------------------------------------------
// POS — counter / billing screen
// ---------------------------------------------------------------------
function POS() {
  const [flavors, setFlavors] = useState([]);
  const [scoopSizes, setScoopSizes] = useState([]);
  const [selectedSize, setSelectedSize] = useState(null);
  const [cart, setCart] = useState([]);
  const [currency, setCurrency] = useState('₹');
  const [paymentMethod, setPaymentMethod] = useState('cash');
  const [placing, setPlacing] = useState(false);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => { loadAll(); }, []);

  async function loadAll() {
    setLoading(true);
    const [flavorsRes, sizesRes, settingsRes] = await Promise.all([
      supabase.from('flavors').select('*').eq('is_active', true).order('name'),
      supabase.from('scoop_sizes').select('*').eq('is_active', true).order('sort_order'),
      supabase.from('settings').select('*').eq('key', 'currency_symbol').maybeSingle(),
    ]);
    if (flavorsRes.data) setFlavors(flavorsRes.data);
    if (sizesRes.data) {
      setScoopSizes(sizesRes.data);
      if (sizesRes.data.length && !selectedSize) setSelectedSize(sizesRes.data[0].id);
    }
    if (settingsRes.data?.value) setCurrency(settingsRes.data.value);
    setLoading(false);
  }

  function showToast(message, tone = 'ok') {
    setToast({ message, tone });
    setTimeout(() => setToast(null), 2500);
  }

  const activeSize = scoopSizes.find((s) => s.id === selectedSize);

  function addToCart(flavor) {
    if (!activeSize) return;
    if (flavor.remaining_ml < activeSize.volume_ml) {
      showToast(`Not enough ${flavor.name} left for a ${activeSize.name.toLowerCase()} scoop`, 'error');
      return;
    }
    setCart((prev) => {
      const existing = prev.find((i) => i.flavorId === flavor.id && i.scoopSizeId === activeSize.id);
      if (existing) {
        return prev.map((i) => (i === existing ? { ...i, quantity: i.quantity + 1 } : i));
      }
      return [...prev, {
        flavorId: flavor.id, flavorName: flavor.name, scoopSizeId: activeSize.id,
        scoopSizeName: activeSize.name, volumeMl: activeSize.volume_ml,
        unitPrice: activeSize.price, quantity: 1,
      }];
    });
    setFlavors((prev) => prev.map((f) => f.id === flavor.id ? { ...f, remaining_ml: f.remaining_ml - activeSize.volume_ml } : f));
  }

  function changeQty(index, delta) {
    setCart((prev) => {
      const item = prev[index];
      const newQty = item.quantity + delta;
      if (newQty <= 0) {
        setFlavors((fPrev) => fPrev.map((f) => f.id === item.flavorId ? { ...f, remaining_ml: f.remaining_ml + item.volumeMl } : f));
        return prev.filter((_, i) => i !== index);
      }
      if (delta > 0) {
        const flavor = flavors.find((f) => f.id === item.flavorId);
        if (flavor && flavor.remaining_ml < item.volumeMl) {
          showToast(`Not enough ${item.flavorName} left`, 'error');
          return prev;
        }
      }
      setFlavors((fPrev) => fPrev.map((f) => f.id === item.flavorId ? { ...f, remaining_ml: f.remaining_ml - delta * item.volumeMl } : f));
      return prev.map((i, idx) => idx === index ? { ...i, quantity: newQty } : i);
    });
  }

  const total = useMemo(() => cart.reduce((sum, i) => sum + i.unitPrice * i.quantity, 0), [cart]);

  async function checkout() {
    if (!cart.length || placing) return;
    setPlacing(true);
    try {
      const { data: sale, error: saleErr } = await supabase
        .from('sales').insert({ total_amount: total, payment_method: paymentMethod }).select().single();
      if (saleErr) throw saleErr;

      const items = cart.map((i) => ({
        sale_id: sale.id, flavor_id: i.flavorId, scoop_size_id: i.scoopSizeId,
        quantity: i.quantity, volume_ml: i.volumeMl * i.quantity,
        unit_price: i.unitPrice, line_total: i.unitPrice * i.quantity,
      }));
      const { error: itemsErr } = await supabase.from('sale_items').insert(items);
      if (itemsErr) throw itemsErr;

      showToast('Sale recorded', 'ok');
      setCart([]);
      await loadAll();
    } catch (err) {
      console.error(err);
      showToast('Something went wrong placing the sale', 'error');
      await loadAll();
    } finally {
      setPlacing(false);
    }
  }

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8 grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-8">
      <div>
        <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
          <h1 className="font-display text-2xl font-bold text-ink">Counter</h1>
          <div className="flex gap-1 bg-white rounded-full p-1 border border-sageline">
            {scoopSizes.map((s) => (
              <button key={s.id} onClick={() => setSelectedSize(s.id)}
                className={`px-4 py-2 rounded-full text-sm font-medium transition-colors ${selectedSize === s.id ? 'bg-teal text-white' : 'text-ink/60 hover:text-ink'}`}>
                {s.name} · {formatCurrency(s.price, currency)}
              </button>
            ))}
          </div>
        </div>

        {loading ? (
          <p className="text-ink/50 font-mono text-sm">Loading flavors…</p>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
            {flavors.map((f) => {
              const level = stockLevel(f.remaining_ml, f.tub_size_ml, f.low_stock_threshold_ml);
              const disabled = !activeSize || f.remaining_ml < (activeSize?.volume_ml ?? 0);
              return (
                <button key={f.id} onClick={() => addToCart(f)} disabled={disabled}
                  className={`group text-left bg-white rounded-2xl p-4 border border-sageline shadow-card transition-all ${disabled ? 'opacity-40 cursor-not-allowed' : 'hover:shadow-cardHover hover:-translate-y-0.5'}`}>
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <div className="font-display font-semibold text-ink">{f.name}</div>
                      <div className="font-mono text-xs text-ink/50 mt-1">{scoopsRemaining(f.remaining_ml)} scoops left</div>
                      {level === 'low' && <div className="font-mono text-[11px] text-coral mt-1">Low stock</div>}
                      {level === 'empty' && <div className="font-mono text-[11px] text-coral mt-1">Empty</div>}
                    </div>
                    <TubGauge remainingMl={f.remaining_ml} tubSizeMl={f.tub_size_ml} lowThresholdMl={f.low_stock_threshold_ml} size="sm" />
                  </div>
                </button>
              );
            })}
            {!flavors.length && <p className="text-ink/50 font-mono text-sm col-span-full">No flavors yet — add some on the Flavors tab.</p>}
          </div>
        )}
      </div>

      <aside className="bg-white rounded-2xl border border-sageline shadow-card p-5 h-fit sticky top-24">
        <h2 className="font-display font-semibold text-ink mb-4">Current order</h2>
        {!cart.length && <p className="text-ink/40 text-sm font-body">Tap a flavor to add a scoop.</p>}
        <ul className="space-y-3 mb-4">
          {cart.map((item, idx) => (
            <li key={idx} className="flex items-center justify-between gap-2">
              <div className="min-w-0">
                <div className="text-sm font-medium text-ink truncate">{item.flavorName}</div>
                <div className="text-xs text-ink/50 font-mono">{item.scoopSizeName} · {formatMl(item.volumeMl)}</div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button onClick={() => changeQty(idx, -1)} className="w-7 h-7 rounded-full border border-sageline text-ink/60 hover:bg-sage font-mono">−</button>
                <span className="w-5 text-center font-mono text-sm">{item.quantity}</span>
                <button onClick={() => changeQty(idx, 1)} className="w-7 h-7 rounded-full border border-sageline text-ink/60 hover:bg-sage font-mono">+</button>
              </div>
            </li>
          ))}
        </ul>

        {!!cart.length && (
          <React.Fragment>
            <div className="border-t border-sageline pt-4 mb-4">
              <div className="flex justify-between font-display font-bold text-lg text-ink">
                <span>Total</span>
                <span className="font-mono">{formatCurrency(total, currency)}</span>
              </div>
            </div>
            <div className="flex gap-1 bg-cream rounded-full p-1 border border-sageline mb-4">
              {['cash', 'card', 'upi'].map((m) => (
                <button key={m} onClick={() => setPaymentMethod(m)}
                  className={`flex-1 py-2 rounded-full text-xs font-medium uppercase tracking-wide transition-colors ${paymentMethod === m ? 'bg-teal text-white' : 'text-ink/50'}`}>
                  {m}
                </button>
              ))}
            </div>
            <button onClick={checkout} disabled={placing}
              className="w-full bg-teal hover:bg-teal-dark text-white font-display font-semibold py-3 rounded-full transition-colors disabled:opacity-50">
              {placing ? 'Placing…' : 'Complete sale'}
            </button>
          </React.Fragment>
        )}
      </aside>

      {toast && (
        <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full font-medium text-sm shadow-cardHover ${toast.tone === 'error' ? 'bg-coral text-white' : 'bg-ink text-white'}`}>
          {toast.message}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------
// Flavors — stock management
// ---------------------------------------------------------------------
function Flavors() {
  const [flavors, setFlavors] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState('');
  const [newTubSize, setNewTubSize] = useState(2000);
  const [openTubFor, setOpenTubFor] = useState(null);
  const [customVolume, setCustomVolume] = useState('');

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    const { data } = await supabase.from('flavors').select('*').order('name');
    if (data) setFlavors(data);
    setLoading(false);
  }

  async function addFlavor(e) {
    e.preventDefault();
    if (!newName.trim()) return;
    const { error } = await supabase.from('flavors').insert({
      name: newName.trim(), tub_size_ml: Number(newTubSize) || 2000, remaining_ml: 0,
      low_stock_threshold_ml: Math.round((Number(newTubSize) || 2000) * 0.15),
    });
    if (!error) { setNewName(''); setNewTubSize(2000); load(); }
  }

  async function openNewTub(flavor, volumeMl) {
    const vol = Number(volumeMl) || flavor.tub_size_ml;
    const { error } = await supabase.from('tub_logs').insert({ flavor_id: flavor.id, volume_added_ml: vol, note: 'New tub opened' });
    if (!error) { setOpenTubFor(null); setCustomVolume(''); load(); }
  }

  async function toggleActive(flavor) {
    await supabase.from('flavors').update({ is_active: !flavor.is_active }).eq('id', flavor.id);
    load();
  }

  async function markEmpty(flavor) {
    await supabase.from('flavors').update({ remaining_ml: 0 }).eq('id', flavor.id);
    load();
  }

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <h1 className="font-display text-2xl font-bold text-ink mb-6">Flavors &amp; stock</h1>

      <form onSubmit={addFlavor} className="bg-white rounded-2xl border border-sageline shadow-card p-5 mb-8 flex flex-wrap items-end gap-4">
        <div>
          <label className="block text-xs font-mono text-ink/50 mb-1">Flavor name</label>
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="e.g. Mango"
            className="border border-sageline rounded-lg px-3 py-2 text-sm w-48 focus:outline-teal" />
        </div>
        <div>
          <label className="block text-xs font-mono text-ink/50 mb-1">Tub size (ml)</label>
          <input type="number" value={newTubSize} onChange={(e) => setNewTubSize(e.target.value)}
            className="border border-sageline rounded-lg px-3 py-2 text-sm w-32 font-mono focus:outline-teal" />
        </div>
        <button type="submit" className="bg-teal hover:bg-teal-dark text-white font-medium px-5 py-2 rounded-full text-sm">Add flavor</button>
      </form>

      {loading ? <p className="text-ink/50 font-mono text-sm">Loading…</p> : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {flavors.map((f) => {
            const level = stockLevel(f.remaining_ml, f.tub_size_ml, f.low_stock_threshold_ml);
            const pct = percentRemaining(f.remaining_ml, f.tub_size_ml);
            return (
              <div key={f.id} className={`bg-white rounded-2xl border border-sageline shadow-card p-5 ${!f.is_active ? 'opacity-50' : ''}`}>
                <div className="flex items-start justify-between gap-3 mb-3">
                  <div>
                    <div className="font-display font-semibold text-ink">{f.name}</div>
                    <div className="font-mono text-xs text-ink/50 mt-1">{formatMl(f.remaining_ml)} / {formatMl(f.tub_size_ml)}</div>
                    <div className="font-mono text-xs text-ink/50">{scoopsRemaining(f.remaining_ml)} single scoops left</div>
                  </div>
                  <TubGauge remainingMl={f.remaining_ml} tubSizeMl={f.tub_size_ml} lowThresholdMl={f.low_stock_threshold_ml} />
                </div>

                <div className="w-full h-1.5 bg-sage rounded-full overflow-hidden mb-4">
                  <div className={`h-full ${level === 'empty' ? 'bg-coral' : level === 'low' ? 'bg-coral/60' : 'bg-teal'}`} style={{ width: `${pct}%` }} />
                </div>

                {openTubFor === f.id ? (
                  <div className="flex gap-2 mb-3">
                    <input autoFocus type="number" placeholder={f.tub_size_ml} value={customVolume} onChange={(e) => setCustomVolume(e.target.value)}
                      className="border border-sageline rounded-lg px-2 py-1.5 text-sm font-mono w-24 focus:outline-teal" />
                    <button onClick={() => openNewTub(f, customVolume)} className="bg-teal text-white text-xs font-medium px-3 py-1.5 rounded-full">Confirm</button>
                    <button onClick={() => { setOpenTubFor(null); setCustomVolume(''); }} className="text-ink/50 text-xs px-2">Cancel</button>
                  </div>
                ) : (
                  <button onClick={() => setOpenTubFor(f.id)} className="w-full bg-sage hover:bg-sageline text-ink font-medium text-sm py-2 rounded-full mb-2 transition-colors">+ Open new tub</button>
                )}

                <div className="flex gap-2 text-xs">
                  <button onClick={() => markEmpty(f)} className="text-coral hover:underline">Mark empty</button>
                  <span className="text-ink/20">·</span>
                  <button onClick={() => toggleActive(f)} className="text-ink/50 hover:underline">{f.is_active ? 'Hide from counter' : 'Show on counter'}</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------
// Reports
// ---------------------------------------------------------------------
function Reports() {
  const RANGES = [{ key: 'today', label: 'Today' }, { key: 'week', label: 'Last 7 days' }, { key: 'all', label: 'All time' }];
  const [range, setRange] = useState('today');
  const [sales, setSales] = useState([]);
  const [items, setItems] = useState([]);
  const [currency, setCurrency] = useState('₹');
  const [loading, setLoading] = useState(true);

  useEffect(() => { load(); }, [range]);

  async function load() {
    setLoading(true);
    let query = supabase.from('sales').select('*').order('created_at', { ascending: false });
    if (range !== 'all') {
      const since = new Date();
      if (range === 'today') since.setHours(0, 0, 0, 0);
      if (range === 'week') since.setDate(since.getDate() - 7);
      query = query.gte('created_at', since.toISOString());
    }
    const { data: salesData } = await query;
    setSales(salesData || []);

    const saleIds = (salesData || []).map((s) => s.id);
    if (saleIds.length) {
      const { data: itemsData } = await supabase.from('sale_items').select('*, flavors(name)').in('sale_id', saleIds);
      setItems(itemsData || []);
    } else {
      setItems([]);
    }

    const { data: settingsData } = await supabase.from('settings').select('*').eq('key', 'currency_symbol').maybeSingle();
    if (settingsData?.value) setCurrency(settingsData.value);
    setLoading(false);
  }

  const totalRevenue = useMemo(() => sales.reduce((s, r) => s + Number(r.total_amount), 0), [sales]);
  const totalScoops = useMemo(() => items.reduce((s, i) => s + i.quantity, 0), [items]);
  const totalVolume = useMemo(() => items.reduce((s, i) => s + Number(i.volume_ml), 0), [items]);

  const byFlavor = useMemo(() => {
    const map = {};
    items.forEach((i) => {
      const name = i.flavors?.name || 'Unknown';
      if (!map[name]) map[name] = { quantity: 0, revenue: 0, volume: 0 };
      map[name].quantity += i.quantity;
      map[name].revenue += Number(i.line_total);
      map[name].volume += Number(i.volume_ml);
    });
    return Object.entries(map).sort((a, b) => b[1].quantity - a[1].quantity);
  }, [items]);

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
        <h1 className="font-display text-2xl font-bold text-ink">Reports</h1>
        <div className="flex gap-1 bg-white rounded-full p-1 border border-sageline">
          {RANGES.map((r) => (
            <button key={r.key} onClick={() => setRange(r.key)}
              className={`px-4 py-2 rounded-full text-sm font-medium transition-colors ${range === r.key ? 'bg-teal text-white' : 'text-ink/60 hover:text-ink'}`}>
              {r.label}
            </button>
          ))}
        </div>
      </div>

      {loading ? <p className="text-ink/50 font-mono text-sm">Loading…</p> : (
        <React.Fragment>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <StatCard label="Revenue" value={formatCurrency(totalRevenue, currency)} />
            <StatCard label="Scoops sold" value={totalScoops.toLocaleString()} />
            <StatCard label="Volume sold" value={formatMl(totalVolume)} />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div>
              <h2 className="font-display font-semibold text-ink mb-3">By flavor</h2>
              <div className="bg-white rounded-2xl border border-sageline shadow-card overflow-hidden">
                {byFlavor.length ? (
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-left text-xs font-mono text-ink/40 border-b border-sageline">
                        <th className="px-4 py-3 font-medium">Flavor</th>
                        <th className="px-4 py-3 font-medium">Scoops</th>
                        <th className="px-4 py-3 font-medium">Volume</th>
                        <th className="px-4 py-3 font-medium">Revenue</th>
                      </tr>
                    </thead>
                    <tbody>
                      {byFlavor.map(([name, d]) => (
                        <tr key={name} className="border-b border-sageline last:border-0">
                          <td className="px-4 py-3 font-medium text-ink">{name}</td>
                          <td className="px-4 py-3 font-mono text-ink/70">{d.quantity}</td>
                          <td className="px-4 py-3 font-mono text-ink/70">{formatMl(d.volume)}</td>
                          <td className="px-4 py-3 font-mono text-ink/70">{formatCurrency(d.revenue, currency)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                ) : <p className="p-4 text-ink/40 text-sm">No sales in this range yet.</p>}
              </div>
            </div>

            <div>
              <h2 className="font-display font-semibold text-ink mb-3">Recent sales</h2>
              <div className="bg-white rounded-2xl border border-sageline shadow-card overflow-hidden max-h-96 overflow-y-auto">
                {sales.length ? (
                  <ul>
                    {sales.map((s) => (
                      <li key={s.id} className="px-4 py-3 border-b border-sageline last:border-0 flex justify-between items-center">
                        <div>
                          <div className="font-mono text-xs text-ink/50">{new Date(s.created_at).toLocaleString()}</div>
                          <div className="text-xs uppercase text-ink/40 font-mono">{s.payment_method}</div>
                        </div>
                        <div className="font-mono font-medium text-ink">{formatCurrency(s.total_amount, currency)}</div>
                      </li>
                    ))}
                  </ul>
                ) : <p className="p-4 text-ink/40 text-sm">No sales in this range yet.</p>}
              </div>
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function StatCard({ label, value }) {
  return (
    <div className="bg-white rounded-2xl border border-sageline shadow-card p-5">
      <div className="text-xs font-mono text-ink/50 mb-1">{label}</div>
      <div className="font-display text-2xl font-bold text-ink">{value}</div>
    </div>
  );
}

// ---------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------
function Settings() {
  const [scoopSizes, setScoopSizes] = useState([]);
  const [settings, setSettings] = useState({});
  const [loading, setLoading] = useState(true);
  const [newSize, setNewSize] = useState({ name: '', volume_ml: '', price: '' });

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    const [sizesRes, settingsRes] = await Promise.all([
      supabase.from('scoop_sizes').select('*').order('sort_order'),
      supabase.from('settings').select('*'),
    ]);
    if (sizesRes.data) setScoopSizes(sizesRes.data);
    if (settingsRes.data) {
      const map = {};
      settingsRes.data.forEach((s) => (map[s.key] = s.value));
      setSettings(map);
    }
    setLoading(false);
  }

  function updateSizeLocal(id, field, value) {
    setScoopSizes((prev) => prev.map((s) => (s.id === id ? { ...s, [field]: value } : s)));
  }

  async function saveSize(size) {
    await supabase.from('scoop_sizes').update({ name: size.name, volume_ml: Number(size.volume_ml), price: Number(size.price) }).eq('id', size.id);
  }

  async function addSize(e) {
    e.preventDefault();
    if (!newSize.name || !newSize.volume_ml || !newSize.price) return;
    const { error } = await supabase.from('scoop_sizes').insert({
      name: newSize.name, volume_ml: Number(newSize.volume_ml), price: Number(newSize.price), sort_order: scoopSizes.length + 1,
    });
    if (!error) { setNewSize({ name: '', volume_ml: '', price: '' }); load(); }
  }

  async function removeSize(id) {
    await supabase.from('scoop_sizes').delete().eq('id', id);
    load();
  }

  async function updateSetting(key, value) {
    setSettings((prev) => ({ ...prev, [key]: value }));
    await supabase.from('settings').upsert({ key, value });
  }

  if (loading) return <p className="max-w-6xl mx-auto px-4 sm:px-6 py-8 text-ink/50 font-mono text-sm">Loading…</p>;

  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-6 py-8">
      <h1 className="font-display text-2xl font-bold text-ink mb-6">Settings</h1>

      <section className="bg-white rounded-2xl border border-sageline shadow-card p-5 mb-8">
        <h2 className="font-display font-semibold text-ink mb-4">Shop</h2>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs font-mono text-ink/50 mb-1">Shop name</label>
            <input defaultValue={settings.shop_name || ''} onBlur={(e) => updateSetting('shop_name', e.target.value)}
              className="border border-sageline rounded-lg px-3 py-2 text-sm w-full focus:outline-teal" />
          </div>
          <div>
            <label className="block text-xs font-mono text-ink/50 mb-1">Currency symbol</label>
            <input defaultValue={settings.currency_symbol || '₹'} onBlur={(e) => updateSetting('currency_symbol', e.target.value)}
              className="border border-sageline rounded-lg px-3 py-2 text-sm w-full font-mono focus:outline-teal" />
          </div>
        </div>
      </section>

      <section className="bg-white rounded-2xl border border-sageline shadow-card p-5">
        <h2 className="font-display font-semibold text-ink mb-1">Scoop sizes &amp; pricing</h2>
        <p className="text-xs text-ink/50 mb-4">Price is fixed per scoop size, the same across all flavors.</p>

        <div className="space-y-3 mb-5">
          {scoopSizes.map((s) => (
            <div key={s.id} className="flex items-center gap-2 flex-wrap">
              <input value={s.name} onChange={(e) => updateSizeLocal(s.id, 'name', e.target.value)} onBlur={() => saveSize(s)}
                className="border border-sageline rounded-lg px-3 py-2 text-sm w-32 focus:outline-teal" />
              <input type="number" value={s.volume_ml} onChange={(e) => updateSizeLocal(s.id, 'volume_ml', e.target.value)} onBlur={() => saveSize(s)}
                className="border border-sageline rounded-lg px-3 py-2 text-sm w-24 font-mono focus:outline-teal" />
              <span className="text-xs text-ink/40 font-mono">ml</span>
              <input type="number" value={s.price} onChange={(e) => updateSizeLocal(s.id, 'price', e.target.value)} onBlur={() => saveSize(s)}
                className="border border-sageline rounded-lg px-3 py-2 text-sm w-24 font-mono focus:outline-teal" />
              <span className="text-xs text-ink/40 font-mono">price</span>
              <button onClick={() => removeSize(s.id)} className="text-coral text-xs ml-auto hover:underline">Remove</button>
            </div>
          ))}
        </div>

        <form onSubmit={addSize} className="flex items-center gap-2 flex-wrap border-t border-sageline pt-4">
          <input placeholder="Name" value={newSize.name} onChange={(e) => setNewSize({ ...newSize, name: e.target.value })}
            className="border border-sageline rounded-lg px-3 py-2 text-sm w-32 focus:outline-teal" />
          <input placeholder="ml" type="number" value={newSize.volume_ml} onChange={(e) => setNewSize({ ...newSize, volume_ml: e.target.value })}
            className="border border-sageline rounded-lg px-3 py-2 text-sm w-24 font-mono focus:outline-teal" />
          <input placeholder="price" type="number" value={newSize.price} onChange={(e) => setNewSize({ ...newSize, price: e.target.value })}
            className="border border-sageline rounded-lg px-3 py-2 text-sm w-24 font-mono focus:outline-teal" />
          <button type="submit" className="bg-teal hover:bg-teal-dark text-white text-sm font-medium px-4 py-2 rounded-full">Add size</button>
        </form>
      </section>
    </div>
  );
}

// ---------------------------------------------------------------------
// App root — simple tab-based nav (no router needed)
// ---------------------------------------------------------------------
function SetupBanner() {
  const needsSetup = window.SUPABASE_URL.includes('your-project') || window.SUPABASE_ANON_KEY.includes('your-anon-key');
  if (!needsSetup) return null;
  return (
    <div className="bg-coralbg border-b border-coral/30 px-4 sm:px-6 py-3 text-sm text-ink">
      <strong>Setup needed:</strong> open this file in a text editor and replace the placeholder
      <code className="mx-1 bg-white px-1.5 py-0.5 rounded font-mono text-xs">SUPABASE_URL</code>
      and
      <code className="mx-1 bg-white px-1.5 py-0.5 rounded font-mono text-xs">SUPABASE_ANON_KEY</code>
      values near the top of the file with your real Supabase project details, then re-open this page.
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('pos');
  return (
    <div className="min-h-screen bg-cream">
      <SetupBanner />
      <Nav tab={tab} setTab={setTab} />
      {tab === 'pos' && <POS />}
      {tab === 'flavors' && <Flavors />}
      {tab === 'reports' && <Reports />}
      {tab === 'settings' && <Settings />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
